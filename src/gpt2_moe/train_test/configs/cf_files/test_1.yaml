MODEL_ATTR:
  vocab_size: 50257
  context_length: 64
  n_layers: 10
  emb_dim: 512
  dropout: 0.1
  ffn_hidden_dim: null
  moe_mask:
    schedule: "none"
    offset: 1

  attention_related:
    num_heads: 8
    dropout: 0.1
    qkv_bias: True

  moe_related:
    experts: 1
    k_routing: 1
    hidden_dim: null

TRAIN:
  epochs: 50
  bs: 32
  lr: 0.0003
  scorers: [exact_match]
  max_per_task: null

EXPCONFIG:
  name: 'E1_scratch_dense'
  init_mode: random
  load_modality: False
  train_experts_individually: False
  stages:
    - name: "full"
      groups: ["base", "ffn"]
      expert: null
      tasks: null
      loss: ce

