# Define the model attributes
MODEL_ATTR:
    vocab_size: 50257
    context_length: 1024
    n_layers: 5
    emb_dim: 256
    dropout: 0.1
    ffn_hidden_dim: null
    moe_mask: 
        schedule: "all"
        offset: 2

    attention_related:
        num_heads: 4
        dropout: 0.1
        qkv_bias: True
    
    moe_related:
        experts: 6
        k_routing: 2
        hidden_dim: null


# Define the train hyperparameter
TRAIN:
  epochs: 25
  bs: 10
  lr: 0.00003 

# Define config
EXPCONFIG:
  name: 'own_first_test'
  init_mode: random
  # Unused param but necessary
  load_modality: False
  train_experts_individually: False
  stages: 
    - name: "full_train"
      groups: ["base", "experts", "router" ,"ffn"]
      expert: null
      tasks: null
      loss: balanced_loss
      loss_params: 
        alpha: 0.01

  

