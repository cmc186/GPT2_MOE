
  MODEL_ATTR:
    vocab_size: 50257
    context_length: 64
    n_layers: 10
    emb_dim: 512
    dropout: 0.1
    ffn_hidden_dim: null
    moe_mask:
      schedule: "alternate"
      offset: 2

    attention_related:
      num_heads: 8
      dropout: 0.1
      qkv_bias: True

    moe_related:
      experts: 6
      k_routing: 2
      hidden_dim: null

  TRAIN:
    epochs: 15
    bs: 64
    lr: 0.0003
    scorers: [exact_match]
    max_per_task: null

  EXPCONFIG:
    name: 'E3_scratch_moe_alternate_joint'
    init_mode: random
    load_modality: False
    train_experts_individually: False
    stages:
      - name: "full"
        groups: ["base", "ffn", "router", "experts"]
        expert: null
        tasks: null
        loss: balanced_loss
        loss_params:
          alpha: 0.01
