

# ------------------------------------------------------------
# E3: dense GPT-2 fine-tune (reference for E4 and E5)
# ------------------------------------------------------------
E3:
  MODEL_ATTR:
    vocab_size: 50257
    context_length: 1024
    n_layers: 12
    emb_dim: 768
    dropout: 0.1
    ffn_hidden_dim: null
    moe_mask:
      schedule: "none"
      offset: 1

    attention_related:
      num_heads: 12
      dropout: 0.1
      qkv_bias: True

    moe_related:
      experts: 1
      k_routing: 1
      hidden_dim: null

  TRAIN:
    epochs: 30
    bs: 16
    lr: 0.00003
    scorers: [token_acc]
    final_scorers: [token_acc, exact_match]
    max_per_task: null

  EXPCONFIG:
    name: 'E3_gpt2_dense_finetune'
    init_mode: gpt2
    load_modality: True
    train_experts_individually: False
    stages:
      - name: "full"
        groups: ["base", "ffn"]
        expert: null
        tasks: null
        loss: ce
