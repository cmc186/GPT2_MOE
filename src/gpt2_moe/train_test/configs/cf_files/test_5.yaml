

# ------------------------------------------------------------
# E5: GPT-2 + sparse upcycling (every expert starts as a copy of the GPT-2 FFN)
#     hidden_dim must be 3072 to match the GPT-2 FFN
#     Requires the upcycling fix in Utils.load_weights
# ------------------------------------------------------------
E5:
  MODEL_ATTR:
    vocab_size: 50257
    context_length: 1024
    n_layers: 12
    emb_dim: 768
    dropout: 0.1
    ffn_hidden_dim: null
    moe_mask:
      schedule: "alternate"
      offset: 2

    attention_related:
      num_heads: 12
      dropout: 0.1
      qkv_bias: True

    moe_related:
      experts: 6
      k_routing: 2
      hidden_dim: 3072

  TRAIN:
    epochs: 30
    bs: 16
    lr: 0.00003
    scorers: [token_acc, routing_jsd]
    final_scorers: [token_acc, exact_match, routing_jsd]
    max_per_task: null

  EXPCONFIG:
    name: 'E5_gpt2_moe_upcycling'
    init_mode: gpt2
    load_modality: True
    upcycling: True
    train_experts_individually: False
    stages:
      - name: "moe"
        groups: ["router", "experts"]
        expert: null
        tasks: null
        loss: balanced_loss
        loss_params:
          alpha: 0.01
